name = "smcTuring"
version = "0.1.0"
defaultTargets = ["SmcTuring"]
buildDir = ".lake/proof-build"

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "302343bb9a029d4edab4f736703f0736896c1b64"

# Keep the alternate proof cache on the same source-identical renderer pin.
# Lake resolves direct requirements in reverse order; keep this override last.
[[require]]
name = "plausible"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/plausible"
rev = "fb13df72ecefd8ddbf9291021d7f33a8673eb57b"

[[lean_lib]]
name = "SmcTuring"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
