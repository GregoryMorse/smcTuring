name: Pinned proof and native acceptance
on:
  workflow_dispatch:
    inputs:
      proof_only:
        description: Verify changed proof dependencies; retain prior unchanged native evidence
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'lean/**/*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lake*.toml'
      - 'lean/lake-manifest.json'
      - 'lean/errata/**'
      - 'smcTuring/**'
      - '!smcTuring/main.cpp'
      - '!smcTuring/tm.asm'
      - '!smcTuring/tm.S'
      - '!smcTuring/CMakeLists.txt'
      - '!smcTuring/cmake/**'
      - '!smcTuring/smcTuring.vcxproj'
      - '!smcTuring/smcTuring.vcxproj.filters'
      - 'validation/**'
      - '!validation/**/*.md'
      - '!validation/run_baseline.py'
      - '.github/workflows/**'
      - '!.github/workflows/cmake.yml'
  pull_request:
    paths:
      - 'lean/**/*.lean'
      - 'lean/lean-toolchain'
      - 'lean/lake*.toml'
      - 'lean/lake-manifest.json'
      - 'lean/errata/**'
      - 'smcTuring/**'
      - '!smcTuring/main.cpp'
      - '!smcTuring/tm.asm'
      - '!smcTuring/tm.S'
      - '!smcTuring/CMakeLists.txt'
      - '!smcTuring/cmake/**'
      - '!smcTuring/smcTuring.vcxproj'
      - '!smcTuring/smcTuring.vcxproj.filters'
      - 'validation/**'
      - '!validation/**/*.md'
      - '!validation/run_baseline.py'
      - '.github/workflows/**'
      - '!.github/workflows/cmake.yml'
concurrency:
  group: proof-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare dependencies and verify in a bounded cgroup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd poppler-utils
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --property=MemoryMax=7500000000 --property=MemorySwapMax=0 \
            --property=CPUQuota=800% --property=TasksMax=512 \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=GITHUB_ACTIONS=true --setenv=GITHUB_SHA="$GITHUB_SHA" \
            --setenv=GITHUB_RUN_ID="$GITHUB_RUN_ID" --setenv=GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            "$(command -v python)" validation/ci/linux_entry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-proof-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            validation/remote-evidence
            validation/ci-results
            validation/errata.json
  windows-native:
    needs: linux-proof
    if: github.event_name != 'workflow_dispatch' || !inputs.proof_only
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      SMCTURING_MSBUILD_TOOLSET: v143
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-proof-evidence
          path: linux-evidence
      - name: Fresh Windows compiler and exporter objects
        shell: pwsh
        run: |
          python validation/ci/proof_bridge.py linux-evidence/remote-evidence/lean.json linux-evidence/ci-results/linux-snapshot.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python validation/ci/bootstrap.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python validation/ci/windows_exports.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Baseline and corrected native acceptance
        shell: pwsh
        run: |
          python validation/ci/windows_native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-native-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            validation/ci-results
            validation/*.json
            validation/.build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-exporter-cache
          include-hidden-files: true
          if-no-files-found: warn
          path: lean/.lake/proof-build
