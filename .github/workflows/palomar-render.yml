name: Palomar Challenge rendering compatibility
run-name: Render compatibility ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public source commit to render (advisory check only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the pinned Palomar renderer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.10'
      - name: Install the pinned renderer dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Prepare the exact source and Challenge
        working-directory: pipeline
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          PALOMAR_EXECUTION_PROFILE: palomar-standard-v1
        run: |
          python -m scripts.render_challenge prepare \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --challenge-sha256 143f5342af4712b6d92b50e67be8ad39a76a947a6fa1d3d2b887dfee19baf93b \
            --project-path lean \
            --challenge-path lean/Challenge.lean \
            --solution-path lean/Solution.lean \
            --comparator-config-path lean/comparator.json \
            --lakefile-path lean/lakefile.toml \
            --lean-toolchain-path lean/lean-toolchain \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json"
          python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"palomar-render"/"report.json"; assert json.loads(p.read_text())["status"] == "pending"'
      - name: Install the pinned Elan and accepted Lean toolchain
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0-rc3
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the pinned Bubblewrap
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Enable the bounded user-scope supervisor
        run: |
          render_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${render_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${render_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user set-property --runtime app.slice \
            MemoryMax=7500000000 MemorySwapMax=0 CPUQuota=800% TasksMax=512
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Render and verify every selected declaration in bounded user scopes
        working-directory: pipeline
        env:
          PALOMAR_EXECUTION_PROFILE: palomar-standard-v1
        run: |
          systemd-run --user --scope --quiet --property=Delegate=yes -- \
            "$(command -v python)" -m scripts.render_challenge execute \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json" \
            --bwrap "$PALOMAR_BWRAP" \
            --renderer-commit d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44 \
            --bwrap-source-tag v0.12.0 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload the advisory render report and HTML bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: palomar-render-compatibility
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/palomar-render/report.json
            ${{ runner.temp }}/palomar-render/result
      - name: Require a complete render
        if: always()
        run: |
          python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"palomar-render"/"report.json"; assert json.loads(p.read_text())["status"] == "pass"'
