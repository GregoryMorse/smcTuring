name: Complete native acceptance from checked public proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1ab379c2288ef5952c6e1bbdb8d655d31e5fbbd4
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-proof-evidence
          run-id: 38108181056
          github-token: ${{ github.token }}
          path: prior-proof
      - name: Verify retained audit and finish errata packaging
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --property=MemoryMax=7500000000 --property=MemorySwapMax=0 \
            --property=CPUQuota=800% --property=TasksMax=512 \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=GITHUB_ACTIONS=true --setenv=GITHUB_SHA="$GITHUB_SHA" \
            --setenv=GITHUB_RUN_ID="$GITHUB_RUN_ID" --setenv=GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            "$(command -v python)" driver/validation/ci/native_recovery.py linux --source source --prior prior-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-proof-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            source/validation/remote-evidence
            source/validation/ci-results
  windows-native:
    needs: linux-finish
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SMCTURING_MSBUILD_TOOLSET: v143
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1ab379c2288ef5952c6e1bbdb8d655d31e5fbbd4
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-proof-evidence
          path: source/linux-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-native-evidence
          run-id: 38115827274
          github-token: ${{ github.token }}
          path: prior-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-exporter-cache
          run-id: 38115827274
          github-token: ${{ github.token }}
          path: source/lean/.lake/proof-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-native-evidence
          run-id: 38117226865
          github-token: ${{ github.token }}
          path: prior-native
      - name: Fresh Windows exporter and native checks
        shell: pwsh
        run: |
          python driver/validation/ci/native_recovery.py windows --source source --windows-prior prior-windows --native-prior prior-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            source/validation/ci-results
            source/validation/*.json
            source/validation/.build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-exporter-cache
          include-hidden-files: true
          if-no-files-found: warn
          path: source/lean/.lake/proof-build
